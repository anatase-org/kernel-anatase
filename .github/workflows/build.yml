name: Build Anatase Kernel Container

on:
  workflow_dispatch:
  push:
    branches:
      - anatase-*
    tags:
      - "*-an*"
      - "*-rc*"

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }} on Fedora ${{ matrix.fedora_version }}
    environment: "prod"
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
        fedora_version: [44]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 10800s

      - name: Maximize build space
        run: |
          df -h
          sudo swapoff -a; sudo rm -f /swapfile
          shopt -s nullglob
          printf '%s\0' /opt/PyPy /opt/az /opt/node/ /opt/pipx /opt/go /opt/Ruby \
              /usr/lib/llvm-* /usr/local/julia* /usr/local/lib/android /usr/share/dotnet \
              /usr/share/swift /usr/local/.ghcup /usr/lib/firefox /opt/google/chrome \
              /opt/microsoft/msedge \
              | sudo xargs -0 -n1 -P4 rm -rf
          df -h

      - name: Login to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build, sign, and push kernel container
        id: build
        env:
          FEDORA_VERSION: ${{ matrix.fedora_version }}
          ARCH: ${{ matrix.arch }}
          PE_SIGNING_TOKEN: ${{ secrets.PE_SIGNING_TOKEN }}
          PE_SIGNING_CERT: ${{ secrets.PE_SIGNING_CERT }}
          PE_SIGNING_PIN: "0"
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}
          GCP_KMS_CERT: anatase-m002.crt
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          IMAGE_REF: ghcr.io/anatase-org/kernel:f${{ matrix.fedora_version }}-${{ matrix.arch }}
          PUSH_IMAGE: "1"
        run: ./build.sh

      - name: Trigger Anatase build
        if: ${{ matrix.fedora_version == 44 }}
        env:
          ANATASE_TRIGGER: ${{ secrets.ANATASE_TRIGGER }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${ANATASE_TRIGGER}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anatase-org/anatase/actions/workflows/build.yml/dispatches \
            --data '{"ref":"master"}'

      # - name: Generate OCI attestation
      #   uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
      #   with:
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     subject-name: ghcr.io/anatase-org/kernel
      #     push-to-registry: true
